name: Release UiCdn

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: uicdn-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      PACKAGE_DIR: Packages/com.garabandic.uicdn
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check version and prepare release notes
        id: version
        run: |
          set -euo pipefail
          version=$(jq -er '.version' "$PACKAGE_DIR/package.json")
          tag="v$version"
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][A-Za-z0-9-]*)'
          pattern="^${number}\.${number}\.${number}(-${identifier}(\.${identifier})*)?$"
          if [[ ! "$version" =~ $pattern ]]; then
            echo "::error::Use a semantic version that OpenUPM can publish unchanged."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::The pushed tag must match $tag from package.json."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run manual releases from main."
            exit 1
          fi
          awk -v version="$version" '/^## / { if (found) exit; found=($2 == version); next } found' "$PACKAGE_DIR/CHANGELOG.md" > "$RUNNER_TEMP/release-notes.md"
          grep -q '[[:alnum:]]' "$RUNNER_TEMP/release-notes.md" || { echo "::error::Missing changelog entry for $version"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TARBALL=com.garabandic.uicdn-$version.tgz" >> "$GITHUB_ENV"

      - name: Validate the catalog and packed files
        run: |
          set -euo pipefail
          node tools/build-registry.mjs
          git diff --exit-code
          node tools/validate-registry.mjs
          npm pack "./$PACKAGE_DIR" --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP/unpacked"
          diff -qr "$PACKAGE_DIR" "$RUNNER_TEMP/unpacked/package"

      - name: Publish the verified tag and tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          ref="refs/tags/$TAG"
          remote_tag=$(git ls-remote --tags origin "$ref")
          if [[ -n "$remote_tag" ]]; then
            git fetch --no-tags origin "$ref"
            [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$sha" ]] || { echo "::error::$TAG already points to another commit"; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$ref" -f sha="$sha" --silent
          fi
          if gh release view "$TAG" --json url > /dev/null 2>&1; then
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$TARBALL"; then
              mkdir "$RUNNER_TEMP/published"
              gh release download "$TAG" --pattern "$TARBALL" --dir "$RUNNER_TEMP/published"
              cmp "$RUNNER_TEMP/$TARBALL" "$RUNNER_TEMP/published/$TARBALL"
            else
              gh release upload "$TAG" "$RUNNER_TEMP/$TARBALL"
            fi
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            options=()
            if [[ "$TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$TAG" "$RUNNER_TEMP/$TARBALL" --verify-tag --title "UiCdn $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${options[@]}"
          fi
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

  openupm:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/openupm.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
