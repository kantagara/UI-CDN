name: Commit titles
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  titles:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate new commit titles
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then
            BASE="origin/$DEFAULT_BRANCH"
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch origin "$BASE"
          fi
          git rev-list "$BASE..HEAD" > "$RUNNER_TEMP/commits"
          while read -r commit; do
            git show -s --format=%B "$commit" > "$RUNNER_TEMP/message"
            if ! .githooks/commit-msg "$RUNNER_TEMP/message"; then
              echo "::error::Invalid commit title in $commit"
              exit 1
            fi
          done < "$RUNNER_TEMP/commits"
